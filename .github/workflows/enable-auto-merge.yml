name: Enable auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Enable repository-default auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullRequests = context.payload.workflow_run.pull_requests ?? [];

            if (pullRequests.length === 0) {
              core.info("이 CI 실행에 연결된 PR이 없습니다.");
              return;
            }

            for (const pullRequest of pullRequests) {
              if (pullRequest.base?.ref !== "main") continue;

              const { data } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullRequest.number,
              });
              if (data.state !== "open" || data.head.sha !== context.payload.workflow_run.head_sha) {
                core.info(`PR #${pullRequest.number}: CI가 확인한 head와 현재 PR 상태가 달라 건너뜁니다.`);
                continue;
              }

              const pullRequestId = data.node_id;
              const state = await github.graphql(
                `query($id: ID!) {
                  node(id: $id) {
                    ... on PullRequest {
                      isDraft
                      state
                      mergeStateStatus
                      autoMergeRequest { enabledAt }
                    }
                  }
                }`,
                { id: pullRequestId }
              );

              if (state.node.isDraft || state.node.state !== "OPEN" || state.node.autoMergeRequest) continue;

              if (state.node.mergeStateStatus === "CLEAN") {
                const result = await github.graphql(
                  `mutation($id: ID!, $mergeMethod: PullRequestMergeMethod!, $expectedHeadOid: GitObjectID!) {
                    mergePullRequest(input: {
                      pullRequestId: $id,
                      mergeMethod: $mergeMethod,
                      expectedHeadOid: $expectedHeadOid
                    }) {
                      pullRequest { number merged }
                    }
                  }`,
                  { id: pullRequestId, mergeMethod: "MERGE", expectedHeadOid: data.head.sha }
                );
                if (!result.mergePullRequest.pullRequest.merged) {
                  throw new Error(`PR #${pullRequest.number} did not merge despite clean status.`);
                }
                core.info(`PR #${pullRequest.number}: CI 통과 후 이미 clean 상태여서 바로 병합했습니다.`);
                continue;
              }

              await github.graphql(
                `mutation($id: ID!, $mergeMethod: PullRequestMergeMethod!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $id,
                    mergeMethod: $mergeMethod
                  }) {
                    pullRequest { number autoMergeRequest { enabledAt } }
                  }
                }`,
                { id: pullRequestId, mergeMethod: "MERGE" }
              );
              core.info(`PR #${pullRequest.number}: 필수 체크 통과 후 자동 병합을 예약했습니다.`);
            }
