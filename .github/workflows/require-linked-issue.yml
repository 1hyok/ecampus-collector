name: Require linked issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  issues: read

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Require a valid closing reference
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const refs = [...body.matchAll(/\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s*:?\s+#(\d+)\b/gi)]
              .map((match) => Number(match[1]));
            const issueNumbers = [...new Set(refs)];

            if (issueNumbers.length === 0) {
              core.setFailed(
                "PR 설명에 `Closes #123`, `Fixes #123`, 또는 `Resolves #123` 형식의 이슈 연결을 추가하세요."
              );
              return;
            }

            for (const issue_number of issueNumbers) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                }));
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(`이슈 #${issue_number}이(가) 이 저장소에 없습니다.`);
                  return;
                }
                throw error;
              }

              if (issue.pull_request) {
                core.setFailed(`#${issue_number}은 이슈가 아니라 PR입니다. 실제 이슈 번호를 연결하세요.`);
                return;
              }
            }

            core.info(`연결된 이슈 확인: ${issueNumbers.map((n) => `#${n}`).join(", ")}`);
